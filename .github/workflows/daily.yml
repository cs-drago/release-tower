name: Release Tower daily
on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 8:00am Pacific (7am PST after Nov 1)
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install httpx python-dotenv
      - name: Collect + analyze + build
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python3 collect.py
          python3 analyze.py > data/last-brief.txt
          python3 build_site.py
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest > /dev/null
          cd site && vercel deploy --prod --yes --token "$VERCEL_TOKEN" > /dev/null
          sleep 3 && echo "HTTP $(curl -s -o /dev/null -w '%{http_code}' https://release-tower.vercel.app)"
      - name: Commit snapshots
        run: |
          git config user.name "release-tower-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshots data/report-*.json data/last-brief.txt site/*.html
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%F)"
          git push
