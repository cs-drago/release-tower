name: Release Tower daily
on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 8:00am Pacific (7am PST after Nov 1)
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      HAVE_KEYS: ${{ secrets.APIFY_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Check secrets
        run: |
          if [ -z "$HAVE_KEYS" ]; then echo "::notice::Secrets not set yet; nothing to do." && echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with: { node-version: "22" }
      - run: pip install httpx python-dotenv
        if: env.SKIP != '1'
      - name: Collect + analyze + build
        if: env.SKIP != '1'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python3 collect.py
          python3 analyze.py > data/last-brief.txt
          python3 build_site.py
      - name: Deploy to Vercel
        if: env.SKIP != '1' && env.VERCEL_TOKEN != ''
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest > /dev/null
          cd site && vercel deploy --prod --yes --token "$VERCEL_TOKEN" > /dev/null
          echo "deployed"
      - name: Commit snapshots
        if: env.SKIP != '1'
        run: |
          git config user.name "release-tower-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshots data/report-*.json data/last-brief.txt site/*.html
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%F)"
          git push
